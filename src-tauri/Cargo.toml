[package]
name = "hm-ideas"
version = "0.3.7"
description = "HM Ideas (Hiraku Manager Ideas): quadro branco e caderno de anotações com caneta"
edition = "2021"

[lib]
name = "hm_ideas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

# Atualizador automático e reinício: só desktop (no Android o app avisa e abre a página de download)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
