[package]
name = "hm-ideas"
version = "0.2.0"
description = "HM Ideas (Hiraku Manager Ideas): quadro branco e caderno de anotações com caneta"
edition = "2021"

[lib]
name = "hm_ideas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
